{% set name = "python-barcode" %}
{% set version = "0.16.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 665ed09516b0088b5593061c5ac8662caa0b08d56bdad328388b1cab39939ac5

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - python-barcode = barcode.pybarcode:main


requirements:
  host:
    - python >=3.5
    - pip
    - setuptools_scm
  run:
    - python
    - pillow

test:
  commands:
    - python-barcode --help
  imports:
    - barcode

about:
  home: http://github.com/WhyNotHugo/python-barcode
  license: MIT
  license_family: MIT
  license_file: LICENCE
  summary: This library provides a simple way to create barcodes using only the Python standard lib
  dev_url: http://github.com/WhyNotHugo/python-barcode

extra:
  recipe-maintainers:
    - sodre
